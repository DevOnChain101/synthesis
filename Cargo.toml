[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
# apps/desktop (GPUI) is built by its own job: the core CI must not need GPUI system libraries.
default-members = ["apps/cli", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
