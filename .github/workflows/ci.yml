# CI for Synthesis. Also reusable: release.yml calls it (workflow_call) so a tag cannot ship on a red commit.
# Third-party actions are pinned to commit SHAs (docs/RELEASE.md "Action pinning"); Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]     # tags are handled by release.yml, which calls this workflow
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1" # weekly: new RustSec advisories / toolchain drift

# Called from release.yml, event_name is the caller's, so groups never collide with a direct run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Toolchain + components come from rust-toolchain.toml.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Fixture-based tests need git, Node and Python 3.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Tool versions
        run: |
          git --version
          node --version
          if command -v python3 >/dev/null; then python3 --version; else python --version; fi
      - name: Git identity (fixture repos commit)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude synthesis-desktop --all-targets --locked -- -D warnings
      # test-provider only exists in debug builds (compile_error! in release). This also runs the
      # synthesis-cli binary tests (apps/cli/tests/*), which need it for the scripted model.
      # --no-fail-fast: a failing binary must not hide the crates after it. The digest step prints the
      # failures as the last lines of the job (the log viewer only shows the tail of a long step).
      # Debuginfo off: the Ubuntu runner ran out of disk (os error 28) building the whole workspace's test binaries.
      - name: cargo test
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
          # Same as the browser job: Chrome's own helper sandbox fails on macOS/Linux runners (Mach rendezvous).
          SYNT_BROWSER_TEST_NO_SANDBOX: ${{ runner.os != 'Windows' && '1' || '' }}
        run: cargo test --workspace --exclude synthesis-desktop --locked --no-fail-fast --features synthesis-cli/test-provider 2>&1 | tee test.log
      - name: Failure digest
        if: always()
        run: DIGEST_ENV=1 bash scripts/ci-digest.sh test.log "cargo test (${{ matrix.os }})"

  desktop:
    # The GPUI desktop app (docs/specs/desktop.md); required by ci-ok on all three OSes.
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # From the build scripts of gpui-pre-linux's dependencies: pkg-config probes fontconfig
      # (yeslogic-fontconfig-sys), freetype (freetype-sys), wayland-client/cursor/egl (wayland-sys);
      # xcb, xkbcommon(-x11) for the X11 backend; the Vulkan loader for the wgpu renderer.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config cmake libfontconfig-dev libfreetype-dev \
            libxcb1-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            mesa-vulkan-drivers libvulkan1
      - run: cargo build -p synthesis-desktop --locked
      - run: cargo clippy -p synthesis-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p synthesis-desktop --locked
      # Runtime evidence: offscreen renders (Metal on macOS, lavapipe on Linux) or a real window (Windows);
      # scripts/desktop-smoke.sh. The PNGs are the artifact to look at.
      - name: Smoke (render / first frame)
        run: bash scripts/desktop-smoke.sh smoke-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-shots-${{ runner.os }}
          path: smoke-out/
          if-no-files-found: ignore

  evals-selftest:
    name: eval selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - name: eval selftest
        run: node tests/agent-evals/harness/selftest.js 2>&1 | tee evals.log
      - name: Failure digest
        if: always()
        run: DIGEST_ENV=1 bash scripts/ci-digest.sh evals.log "eval selftest (${{ matrix.os }})"

  browser:
    # Real Chrome from browser-actions/setup-chrome (stable channel). Synthesis never downloads a browser,
    # so SYNT_BROWSER_PATH points at the one installed here.
    name: browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # TODO(macos-browser): Chrome helpers fail Mach port rendezvous on GitHub macOS runners
    # (bootstrap_look_up ... Unknown service name 1102). Drop this once a runner/Chrome combination passes.
    # TODO(windows-browser): earlier "exit code 101 with no output" was the step's own `bash -e` ending at the
    # first failing test before its output was logged (fixed: `|| rc=$?`). The real test failure is now in
    # browser.log; diagnose it from there. Non-blocking like macOS until fixed.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # The runner images preinstall stable Google Chrome; the setup-chrome Chromium build cannot find its
      # Mach rendezvous service on macOS runners. Prefer the preinstalled one, install only if absent.
      - id: pre
        name: Locate preinstalled Chrome
        run: |
          case "$RUNNER_OS" in
            macOS) c="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;;
            Windows) c="C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" ;;
            *) c="$(command -v google-chrome || true)" ;;
          esac
          if [ -n "$c" ] && [ -f "$c" ]; then echo "path=$c" >>"$GITHUB_OUTPUT"; else echo "path=" >>"$GITHUB_OUTPUT"; fi
      - id: chrome
        if: steps.pre.outputs.path == ''
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
      - name: Browser tests
        shell: bash
        timeout-minutes: 25 # per-test caps below name the hang; fail fast with the log so far instead of hanging to the job limit
        env:
          SYNT_BROWSER_PATH: ${{ steps.pre.outputs.path || steps.chrome.outputs.chrome-path }}
        run: |
          echo "Chrome: $SYNT_BROWSER_PATH"
          # `chrome.exe --version` does NOT print on Windows: it launches the browser and never returns
          # (this alone hung the step for 15-25 min). Read the file version instead.
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "(Get-Item -LiteralPath '$SYNT_BROWSER_PATH').VersionInfo.ProductVersion" || echo "(could not read the Chrome version)"
          else
            "$SYNT_BROWSER_PATH" --version || echo "(could not print the Chrome version)"
          fi
          # Chrome's OWN helper sandbox is unusable on these ephemeral VMs (Linux: AppArmor userns
          # restriction; macOS: Mach port rendezvous denied, "Page.enable got no answer"). The test
          # hook only adds --no-sandbox so the tests can exercise OUR URL policy; production keeps
          # Chrome's sandbox ON (default). Windows keeps it on.
          if [ "$RUNNER_OS" != Windows ]; then export SYNT_BROWSER_TEST_NO_SANDBOX=1; fi
          # One test binary invocation per test, each with its own wall-clock cap, so a hang names the
          # test (step output + $GITHUB_STEP_SUMMARY) instead of eating the whole step. Test output goes
          # to a file, not a pipe: Chrome processes inherit pipe handles on Windows and would keep the
          # reader (and the step) alive after the test is done. Leftover Chrome is killed between tests.
          : > browser.log
          say() { echo "$@" | tee -a browser.log; }
          killchrome() { if [ "$RUNNER_OS" = Windows ]; then taskkill //F //T //IM chrome.exe >/dev/null 2>&1 || true; fi; }
          cargo test -p synthesis-browser --locked --lib > lib.log 2>&1 || { cat lib.log; exit 1; }
          bin=$(cargo test -p synthesis-browser --locked --test browser --no-run --message-format=json \
                | jq -r 'select(.executable != null) | .executable' | tail -n 1)
          say "[$(date -u +%T)] test binary: $bin"
          failed=""
          for t in $("$bin" --list --format terse | sed -n 's/: test$//p'); do
            say "[$(date -u +%T)] START $t"
            rc=0 # the runs below end in `|| rc=$?`: under `bash -e` a failing test (exit 101) would otherwise end the step here, before its output is logged
            # 124 = timed out, 137 = killed. GNU timeout (Linux, Git for Windows' bash), gtimeout, or perl
            # alarm (macOS has no `timeout`; the exit code 142 = SIGALRM is mapped to 124).
            if command -v timeout >/dev/null 2>&1; then
              timeout --kill-after=10 150 "$bin" --exact "$t" --nocapture --test-threads=1 > one.log 2>&1 || rc=$?
            elif command -v gtimeout >/dev/null 2>&1; then
              gtimeout --kill-after=10 150 "$bin" --exact "$t" --nocapture --test-threads=1 > one.log 2>&1 || rc=$?
            else
              perl -e 'alarm shift; exec @ARGV' 150 "$bin" --exact "$t" --nocapture --test-threads=1 > one.log 2>&1 || rc=$?
            fi
            [ $rc -eq 142 ] && rc=124
            if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
              say "[$(date -u +%T)] HANG $t (rc=$rc, no exit after 150 s)"
              failed="$failed $t(hang)"
            elif [ $rc -ne 0 ]; then
              failed="$failed $t(rc=$rc)"
            fi
            if [ $rc -ne 0 ] && [ "$RUNNER_OS" = Windows ]; then
              say "chrome processes at failure:"
              powershell -NoProfile -Command "Get-Process chrome -ErrorAction SilentlyContinue | Select-Object Id,StartTime,@{n='MB';e={[int]($_.WorkingSet64/1MB)}} | Format-Table | Out-String" 2>&1 | tee -a browser.log || true
            fi
            killchrome
            cat one.log >> browser.log; tail -n 80 one.log
            say "[$(date -u +%T)] END $t rc=$rc"
          done
          echo "browser tests failed:${failed:- none}" | tee -a "$GITHUB_STEP_SUMMARY"
          # The suite prints SKIP and passes without a browser: make skipping a failure here.
          if grep -q "SKIP" browser.log; then echo "::error::browser tests were skipped"; exit 1; fi
          [ -z "$failed" ]
      - name: Browser log tail
        if: always()
        shell: bash
        run: echo "---- last 120 lines of browser.log ----"; tail -n 120 browser.log || echo "(no browser.log)"
      - name: Failure digest
        if: always()
        env:
          SYNT_BROWSER_PATH: ${{ steps.pre.outputs.path || steps.chrome.outputs.chrome-path }}
        run: DIGEST_ENV=1 bash scripts/ci-digest.sh browser.log "browser (${{ matrix.os }})"

  sandbox-linux:
    # Landlock + bubblewrap integration tests (cfg linux). Ubuntu 24.04 blocks unprivileged user
    # namespaces via AppArmor, which breaks bwrap; relax it for this job only.
    name: sandbox (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install bubblewrap and relax AppArmor userns restriction
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-net true && echo "bwrap works"
      - name: Require Landlock (otherwise the tests silently skip)
        run: |
          cat /sys/kernel/security/lsm; echo
          grep -q landlock /sys/kernel/security/lsm || { echo "::error::Landlock not enabled on this runner kernel"; exit 1; }
      - name: sandbox tests
        run: cargo test -p synthesis-sandbox -p synthesis-terminal --locked --no-fail-fast -- --nocapture 2>&1 | tee sandbox.log
      - name: Failure digest
        if: always()
        run: DIGEST_ENV=1 bash scripts/ci-digest.sh sandbox.log "sandbox (linux)"
      - name: doctor reports the Linux backends
        run: cargo run -q --locked -p synthesis-cli -- doctor --cwd "$RUNNER_TEMP"

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.89" # overrides rust-toolchain.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace --exclude synthesis-desktop --all-targets --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo doc --workspace --exclude synthesis-desktop --no-deps --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses bans sources advisories

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  shell-scripts:
    # Lints the installer and runs actionlint over the workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -S warning scripts/*.sh
      - name: Tracked paths are portable to Windows
        run: node scripts/check-portable-paths.mjs
      - name: No new use of the old product name
        run: node scripts/check-no-legacy-name.mjs
      - name: Release tag policy tests (local origin + stub gh)
        run: bash scripts/test-check-release-tag.sh
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  ci-ok:
    # Single required status check for branch protection.
    if: always()
    needs: [test, desktop, evals-selftest, browser, sandbox-linux, msrv, docs, deny, audit, shell-scripts]
    runs-on: ubuntu-latest
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then exit 1; fi
