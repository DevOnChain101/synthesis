[package]
name = "synthesis-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-context = { path = "../synthesis-context" }
synthesis-core = { path = "../synthesis-core" }
synthesis-events = { path = "../synthesis-events" }
synthesis-hooks = { path = "../synthesis-hooks" }
synthesis-peers = { path = "../synthesis-peers" }
synthesis-permissions = { path = "../synthesis-permissions" }
synthesis-providers = { path = "../synthesis-providers" }
synthesis-settings = { path = "../synthesis-settings" }
synthesis-tools = { path = "../synthesis-tools" }
synthesis-verification = { path = "../synthesis-verification" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# default-features off: no HTTP schema resolver (same as synthesis-tools).
jsonschema = { version = "0.60", default-features = false }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
uuid = { version = "1", features = ["v4"] }

[features]
# Builds `PersonApproved::for_text`: only the approval-card code path (P3b) and tests may. A build without
# `debug_assertions` refuses it (compile_error in lib.rs) unless `approval-card-in-release` is also on, which only
# the product crate that owns the card code may set; `tests/person_approved_guard.rs` fails if any `src` file
# outside this crate calls the constructor.
approval-card = []
approval-card-in-release = []

[dev-dependencies]
synthesis-harness = { path = ".", features = ["approval-card"] }
synthesis-terminal = { path = "../synthesis-terminal" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
