[package]
name = "synthesis-peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

# Cross-session peer transport (docs/specs/messaging.md Part B, R10b-1): endpoint, key, registry,
# frames, mutual HMAC handshake, read-only request server and client. No harness dependency; the
# harness plugs in through the `Responder` trait.
[dependencies]
base64 = "0.22"
getrandom = "0.3"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["net", "io-util", "rt", "time", "sync", "macros"] }

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
