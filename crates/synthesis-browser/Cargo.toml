[package]
name = "synthesis-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-platform = { path = "../synthesis-platform" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
psl = "2" # public-suffix list (MIT/Apache-2.0, addr-rs/psl; list updated by releases)
regex = "1.13.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "net", "io-util", "macros", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW constant only (no unsafe)
libc = "0.2"
# kill(-pgid, 0) probe on close, without unsafe
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread"] }
