[package]
name = "synthesis-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `SYNT_TEST_FORCE_BACKEND=landlock-only|none` forces `detect()` (Landlock only / no sandbox). Debug builds only.
test-backend = []

[dependencies]
dunce = "1.0.5"
synthesis-platform = { path = "../synthesis-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock is best-effort by default; the code sets HardRequirement explicitly.
landlock = "0.4.7"
# Pure-Rust seccomp-bpf (the unsafe lives in the crate): denies socket(AF_VSOCK) on WSL.
seccompiler = { version = "0.5.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
# `--network hosts` end-to-end tests run the real proxy
synthesis-egress = { path = "../synthesis-egress" }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread"] }
