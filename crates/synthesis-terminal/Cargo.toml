[package]
name = "synthesis-terminal"
version.workspace = true
edition.workspace = true
# process-wrap 10 needs 1.87 (docs/research/crates.md: workspace MSRV must rise).
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-config = { path = "../synthesis-config" }
synthesis-core = { path = "../synthesis-core" }
synthesis-events = { version = "0.1.0", path = "../synthesis-events" }
synthesis-platform = { path = "../synthesis-platform" }
synthesis-sandbox = { path = "../synthesis-sandbox" }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "process-session", "job-object"] }
regex = "1.13.1"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "net", "io-util", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
# harden_dll_search: SetDefaultDllDirectories before portable-pty's bare-name LoadLibrary
synthesis-sandbox-win = { path = "../synthesis-sandbox-win" }

[target.'cfg(unix)'.dependencies]
# safe kill_process_group and waitid (no unsafe in our code)
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3.27.0"
