[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
# apps/desktop (GPUI) needs platform system libraries on Linux; build it explicitly:
#   cargo build -p synthesis-desktop
default-members = [
    "apps/cli",
    "crates/synthesis-app",
    "crates/synthesis-browser",
    "crates/synthesis-config",
    "crates/synthesis-context",
    "crates/synthesis-core",
    "crates/synthesis-egress",
    "crates/synthesis-events",
    "crates/synthesis-harness",
    "crates/synthesis-hooks",
    "crates/synthesis-mcp",
    "crates/synthesis-orchestrator",
    "crates/synthesis-memory",
    "crates/synthesis-peers",
    "crates/synthesis-permissions",
    "crates/synthesis-platform",
    "crates/synthesis-providers",
    "crates/synthesis-sandbox",
    "crates/synthesis-session",
    "crates/synthesis-settings",
    "crates/synthesis-settings-ui",
    "crates/synthesis-terminal",
    "crates/synthesis-tools",
    "crates/synthesis-cli-ui",
    "crates/synthesis-cli-ui-base",
    "crates/synthesis-cli-ui-render",
    "crates/synthesis-verification",
    "crates/synthesis-view",
    "crates/synthesis-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
