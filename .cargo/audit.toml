# cargo-audit policy (CI: `cargo audit --deny warnings`). Every entry needs a written reason.
# All eight are "unmaintained" notices (no vulnerability) reached only through the GPUI desktop
# app's pinned UI stack (apps/desktop: gpui-pre 0.3.10, gpui-component 0.8.1); none is in the engine,
# CLI or TUI. They go away only with a new GPUI release, so re-check on every GPUI bump.
[advisories]
ignore = [
  # gpui-base / gpui-component timing helper; replaced upstream by web-time, not by us.
  "RUSTSEC-2024-0384", # instant
  # proc-macro (build time only) used by gpui-component and metal (macOS GPU bindings).
  "RUSTSEC-2024-0436", # paste
  # gpui-pre-reqwest (asset HTTP client of gpui-kit-assets); parses PEM files, never fed untrusted ones here.
  "RUSTSEC-2025-0134", # rustls-pemfile
  # text shaping / font parsing inside usvg, resvg, cosmic-text (SVG icons and font loading of the
  # bundled, trusted font and icon files).
  "RUSTSEC-2026-0206", # rustybuzz
  "RUSTSEC-2026-0192", # ttf-parser
  # D-Bus stack (zbus via ashpd/oo7 in gpui-pre-linux: file dialogs, desktop portals); Linux only.
  "RUSTSEC-2026-0371", # zbus_names
  "RUSTSEC-2026-0370", # zvariant
  "RUSTSEC-2026-0372", # zvariant_derive
]
