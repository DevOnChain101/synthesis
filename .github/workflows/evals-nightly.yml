# Nightly / manual evals with a REAL model (tests/agent-evals, adapter "rust"). Skipped cleanly when the repository has no
# credentials: add the secret SYNT_API_KEY (credential for SYNT_PROVIDER, docs/specs/config.md) and optionally the
# variables SYNT_EVAL_PROVIDER (default anthropic), SYNT_EVAL_MODEL (provider/model) and SYNT_EVAL_MAX_COST_USD
# (per run, default 1). The secret lives in the GitHub Environment `evals-nightly` (repository Settings > Environments:
# create it, add SYNT_API_KEY there, restrict "Deployment branches" to `main`, optionally add required reviewers); the job
# also refuses to run from any other ref. Publishes status-ok / false-success / cost as the job summary and as an artifact.
# The key is only in the environment of the eval step; nothing here echoes it.
name: Evals nightly

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "runs per task"
        default: "1"
      tasks:
        description: "comma-separated task ids (empty: all non-gaming tasks)"
        default: ""
      include_transcripts:
        description: "also upload raw transcripts (readable by anyone who can read artifacts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evals-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  evals:
    name: evals (real model)
    if: github.ref == 'refs/heads/main'
    environment: evals-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAVE_KEY: ${{ secrets.SYNT_API_KEY != '' && 'yes' || 'no' }}
    steps:
      - name: Credentials present?
        run: |
          if [ "$HAVE_KEY" != yes ]; then
            echo "SKIP: the repository secret SYNT_API_KEY is not set, so no real-model evals ran." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAVE_KEY == 'yes'
        with:
          persist-credentials: false
      - name: Install Rust toolchain (rust-toolchain.toml)
        if: env.HAVE_KEY == 'yes'
        run: rustup toolchain install && rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.HAVE_KEY == 'yes'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAVE_KEY == 'yes'
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: env.HAVE_KEY == 'yes'
        with:
          python-version: "3.x"
      - name: Git identity (fixture repos commit)
        if: env.HAVE_KEY == 'yes'
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Install bubblewrap and relax AppArmor userns restriction
        if: env.HAVE_KEY == 'yes'
        run: |
          scripts/apt-install.sh bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build synt
        if: env.HAVE_KEY == 'yes'
        run: cargo build --locked -p synthesis-cli
      - name: Run the evals
        if: env.HAVE_KEY == 'yes'
        env:
          SYNT_API_KEY: ${{ secrets.SYNT_API_KEY }}
          SYNT_PROVIDER: ${{ vars.SYNT_EVAL_PROVIDER || 'anthropic' }}
          EVAL_MODEL: ${{ vars.SYNT_EVAL_MODEL }}
          EVAL_MAX_COST_USD: ${{ vars.SYNT_EVAL_MAX_COST_USD || '1' }}
          RUNS: ${{ inputs.runs || '1' }}
          TASKS: ${{ inputs.tasks }}
        run: |
          # inputs are untrusted text: integer 1..5 runs, at most 10 task ids of [a-z0-9-]
          [[ "$RUNS" =~ ^[1-5]$ ]] || { echo "runs must be an integer from 1 to 5"; exit 2; }
          [[ -z "$TASKS" || "$TASKS" =~ ^[a-z0-9-]+(,[a-z0-9-]+){0,9}$ ]] || { echo "tasks must be up to 10 comma-separated task ids"; exit 2; }
          args=(--agent rust --runs "$RUNS" --out evals-out)
          if [ -n "$TASKS" ]; then args+=(--task "$TASKS"); fi
          # The key reaches the adapter only through a 0600 file (a one-shot copy per run, deleted by the adapter at
          # start): the long-lived harness process, whose /proc/<pid>/environ agent-written checks could read, never
          # holds it. Graded checks run in their own PID and network namespaces (bwrap).
          key_file="$RUNNER_TEMP/synt-key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077; printf '%s' "$SYNT_API_KEY" > "$key_file")
          # exit 70 = an adapter error; a failed task is a result, not a job failure
          EVAL_KEY_FILE="$key_file" EVAL_CHECK_SANDBOX=bwrap \
            env -u SYNT_API_KEY node tests/agent-evals/harness/run.js "${args[@]}" 2>&1 | tee evals.log
      - name: Publish the summary
        if: env.HAVE_KEY == 'yes' && always()
        run: |
          node tests/agent-evals/harness/summary.mjs evals-out | tee -a "$GITHUB_STEP_SUMMARY" > summary.md
      - name: Choose what to upload
        if: env.HAVE_KEY == 'yes' && always()
        env:
          TRANSCRIPTS: ${{ inputs.include_transcripts }}
        run: |
          # Raw transcripts (events, model output, tool output) can be read by anyone who can read the repository's
          # artifacts: only result.json files and the summary are uploaded unless include_transcripts is true.
          rm -rf evals-upload; mkdir -p evals-upload
          if [ "$TRANSCRIPTS" = true ]; then
            cp -R evals-out/. evals-upload/ 2>/dev/null || true
          else
            (cd evals-out 2>/dev/null && find . -name result.json -exec cp --parents {} ../evals-upload \;) || true
          fi
          cp summary.md evals-upload/ 2>/dev/null || true
      - name: The key must not be in anything that gets uploaded
        if: env.HAVE_KEY == 'yes' && always()
        env:
          SYNT_API_KEY: ${{ secrets.SYNT_API_KEY }}
        run: |
          # best effort: the key as is, base64, URL-encoded, reversed, and its first and last 8 characters
          node -e '
            const k = process.env.SYNT_API_KEY, fs = require("fs"), path = require("path");
            const needles = new Set([k, Buffer.from(k).toString("base64"), encodeURIComponent(k), [...k].reverse().join(""), k.slice(0, 8), k.slice(-8)]);
            let hit = false;
            const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const f = path.join(d, e.name); if (e.isDirectory()) walk(f); else { const t = fs.readFileSync(f, "latin1"); for (const n of needles) if (t.includes(n)) { hit = true; console.log("::error::key material in " + f); break; } } } };
            walk("evals-upload"); process.exit(hit ? 1 : 0);
          ' || { rm -rf evals-upload; echo "artifact NOT uploaded"; exit 1; }
          echo "no key material found in evals-upload"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.HAVE_KEY == 'yes' && always()
        with:
          name: evals-nightly
          path: evals-upload/
          if-no-files-found: ignore
