# cargo-deny policy. Run: cargo deny check
[graph]
targets = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin", "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices (no vulnerability) reached only through the GPUI desktop app's pinned UI stack
# (apps/desktop: gpui-pre 0.3.10, gpui-component 0.8.1), never the engine, CLI or TUI. Same list and
# reasons as .cargo/audit.toml; re-check on every GPUI bump.
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant: timing helper of gpui-base/gpui-component" },
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time proc-macro of gpui-component and metal" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: gpui-pre-reqwest asset client, no untrusted PEM input" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz: text shaping in usvg/resvg/cosmic-text, bundled trusted fonts and icons" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser: font parsing in usvg/fontdb/cosmic-text, bundled trusted fonts" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: D-Bus stack of gpui-pre-linux (desktop portals), Linux only" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: D-Bus stack of gpui-pre-linux (desktop portals), Linux only" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: D-Bus stack of gpui-pre-linux (desktop portals), Linux only" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "OpenSSL", "BSL-1.0", "MIT-0",
  # permissive, OSI approved; enum-iterator(-derive) of gpui-component (apps/desktop)
  "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow" # workspace path deps have no version; crates are not published
deny = [
  # TLS is rustls; keep OpenSSL out of the static release binaries.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
