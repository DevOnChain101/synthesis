[package]
name = "synthesis-egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
synthesis-events = { path = "../synthesis-events" }
synthesis-platform = { path = "../synthesis-platform" }
base64 = "0.22"
getrandom = "0.3"
httparse = "1.10.1"
tokio = { version = "1.54.1", default-features = false, features = ["net", "io-util", "rt", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
