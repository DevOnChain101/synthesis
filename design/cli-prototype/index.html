<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthesis</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/synthesis-app-icon-32.png">
<link rel="icon" href="assets/synthesis-app-icon.ico">
<style>
:root{
  --bg:#0B0C0F;--surface:#15171B;--elevated:#242830;--border:#606978;
  --text:#C4CAD6;--text-strong:#F2F4F8;--accent:#D9D9E0;--accent-light:#F7F8FA;
  --muted-blue:#0B1322;--soft-beige:#D7CEC7;
  --line:rgba(116,126,145,.88);--dim:#B5BECD;
  --green:#4ade80;--green-2:#7bd88f;--amber:#e0b252;--red:#e5636b;--blue:#6ea8ff;
  --teal:#4fd1c5;--purple:#b794f6;--pink:#f472b6;--orange:#f59e42;
  --add-bg:rgba(74,222,128,.12);--del-bg:rgba(229,99,107,.14);
  --mono:"Fira Code","JetBrains Mono",Consolas,Menlo,ui-monospace,monospace;
}
@font-face{font-family:"Fira Code";font-weight:400;font-style:normal;font-display:swap;src:url("assets/fonts/FiraCode-Regular.ttf") format("truetype")}
@font-face{font-family:"Fira Code";font-weight:500;font-style:normal;font-display:swap;src:url("assets/fonts/FiraCode-Medium.ttf") format("truetype")}
@font-face{font-family:"Fira Code";font-weight:700;font-style:normal;font-display:swap;src:url("assets/fonts/FiraCode-Bold.ttf") format("truetype")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url("assets/fonts/JetBrainsMono-Regular.ttf") format("truetype")}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-ligatures:none}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
*::-webkit-scrollbar-track{background:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:500 12.5px/1.55 var(--mono);overflow:auto}
body{background:
  radial-gradient(900px 520px at 88% -8%,rgba(110,168,255,.10),transparent 62%),
  radial-gradient(760px 520px at 6% 108%,rgba(215,206,199,.07),transparent 60%),
  radial-gradient(600px 400px at 50% 40%,rgba(11,19,34,.55),transparent 70%),var(--bg)}
#app{width:100vw;height:100vh;min-width:1280px;min-height:720px;display:grid;grid-template-rows:minmax(0,1fr) 28px}
.view{display:grid;grid-template-rows:46px minmax(0,1fr);min-height:0}
.view[hidden]{display:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:3px}
h1,h2,h3{margin:0;font:inherit}
dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
strong,b{color:var(--text-strong);font-weight:600}
.dim{color:var(--dim)}.strong{color:var(--text-strong)}
.c-green{color:var(--green)}.c-amber{color:var(--amber)}.c-red{color:var(--red)}.c-blue{color:var(--blue)}
.c-teal{color:var(--teal)}.c-purple{color:var(--purple)}.c-pink{color:var(--pink)}.c-orange{color:var(--orange)}.c-lime{color:var(--green-2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;flex:none}
.dot.off{background:transparent;box-shadow:none;border:1px solid var(--dim);color:var(--dim)}
svg.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* top bar */
.topbar{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(11,12,15,.6);gap:0;min-width:0}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(217,217,224,.25))}
.brand .name{color:var(--text-strong);letter-spacing:.32em;font-size:14px;font-weight:700}
.brand .sub{color:var(--text);letter-spacing:.22em;font-size:13px}
.tchips{display:flex;margin-left:28px;min-width:0;overflow:hidden}
.tchip{display:flex;align-items:center;gap:6px;padding:0 14px;height:22px;border-left:1px solid var(--line);white-space:nowrap}
.tchip b{font-weight:500}
.sp{flex:1}
.clock{font-variant-numeric:tabular-nums;white-space:nowrap}

/* panels */
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.panel{background:linear-gradient(180deg,rgba(21,23,27,.9),rgba(14,15,19,.92));border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.panel>header{display:flex;align-items:center;gap:8px;padding:9px 12px 6px;flex:none}
.panel>header h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--text-strong));font-weight:500}
.panel>header>svg.ic{color:var(--c,var(--accent))}
.panel>header .meta{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px}
.panel>.body{padding:2px 12px 10px;overflow:auto;min-height:0;flex:1 1 auto}
.panel.fit{flex:0 1 auto}
.panel.grow{flex:1 1 0}
.kv{display:grid;grid-template-columns:58px 1fr;gap:3px 12px}
.kv dt{color:var(--dim)}.kv dd{color:var(--text-strong);min-width:0}
.rows li{display:flex;align-items:center;gap:8px;padding:2px 0;min-width:0}
.rows li .r{margin-left:auto;flex:none;color:var(--dim)}
.history-time{width:64px;flex:none;color:var(--dim);font-variant-numeric:tabular-nums}
.history-time+.ellip{flex:1;min-width:0}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6b7385,var(--accent))}
.ws-item{display:flex;align-items:center;gap:8px;padding:3px 8px;border:1px solid transparent;border-radius:5px;color:var(--text);width:100%;background:none;text-align:left}
.ws-item[aria-current=true]{background:var(--elevated);border-color:var(--border);border-left:3px solid var(--accent);padding-left:6px;color:var(--text-strong)}
.ws-txt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.ws-name,.ws-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-sub{font-size:11.5px;color:var(--dim)}
.ws-item[aria-current=true] .ws-sub{color:var(--text)}
.ws-item:hover{color:var(--text-strong)}
.session-list{margin:1px 0 3px 20px;border-left:1px solid var(--line);padding-left:8px}
.session-item{display:flex;align-items:center;gap:7px;width:100%;padding:1px 4px;border:1px solid transparent;border-radius:4px;background:none;color:var(--text);text-align:left;min-width:0}
.session-item .ellip{min-width:0}.session-item .r{margin-left:auto;flex:none;color:var(--dim)}
.session-item[aria-current=true],.session-item:hover{color:var(--text-strong);background:rgba(255,255,255,.03)}
.ws-path{padding-left:20px;margin-bottom:4px}.workspace-files{margin-top:4px}
.pill{padding:0 6px;border-radius:9px;font-size:11px}
.run-item{display:flex;gap:8px;width:100%;padding:5px 7px 5px 6px;border:1px solid transparent;border-left:3px solid transparent;border-radius:5px;background:none;color:var(--text);text-align:left;min-width:0}
.run-item:hover{color:var(--text-strong);background:rgba(255,255,255,.03)}
.run-item[aria-current=true]{background:var(--elevated);border-color:var(--border);border-left-color:var(--accent);color:var(--text-strong)}
.run-item>.dot{margin-top:5px}
.run-main{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.run-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.run-top .r{margin-left:auto;flex:none;color:var(--dim);font-variant-numeric:tabular-nums}
.run-sub{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:11.5px;min-width:0}
.run-item[aria-current=true] .run-sub{color:var(--text)}
.run-sub .f{color:var(--blue);flex:none}
.run-sub .brn{display:inline-flex;align-items:center;gap:3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-sub .brn svg{width:12px;height:12px}

/* ---------- VIEW 1 ---------- */
.grid1{display:grid;grid-template-columns:250px minmax(320px,1fr) 500px;gap:10px;padding:10px;min-height:0}
#view1 .col.l .panel{flex:0 1 auto}
#view1 .col.l .panel.grow{flex:1 1 auto}
.cards{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:10px;flex:none}
.status-context{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.agent-summary{display:grid;gap:2px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.agent-summary span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chk li{display:flex;gap:8px;align-items:center;padding:1px 0}
.circ{width:11px;height:11px;border-radius:50%;border:1px solid var(--dim);flex:none}
.circ.done{border-color:var(--green);background:radial-gradient(circle,var(--green) 0 3px,transparent 4px);color:var(--green)}
.circ.now{border-color:var(--accent)}
.term{flex:1 1 0;min-height:0}
.tabs{display:flex;align-items:stretch;height:32px;border-bottom:1px solid var(--line);flex:none;background:rgba(0,0,0,.18)}
.tab{background:none;border:0;border-right:1px solid var(--line);padding:0 18px;color:var(--text);letter-spacing:.06em;position:relative;display:flex;align-items:center;gap:6px}
.tab[aria-selected=true]{color:var(--text-strong);background:var(--elevated);box-shadow:inset 0 -2px 0 var(--accent)}
.tab.up{text-transform:uppercase}
.tab:hover{color:var(--text-strong)}
.tabs .x{margin-left:auto;border-right:0;border-left:1px solid var(--line);padding:0 12px}
.tbody{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(112px,172px);gap:0;overflow:auto;padding:0}
.tbody[data-tab=terminal],.pane.terminal{font-weight:500}
.tbody[data-tab=agent],.tbody[data-tab=workspace],.tbody[data-tab=diff]{grid-template-rows:auto 1fr}
.tsec[hidden]{display:none}
.tprompt{padding:10px 14px 4px}
.tprompt .ps{color:var(--text-strong)}
.tprompt .br{color:var(--red)}
.hist div{white-space:pre-wrap}
.steps{padding:6px 14px 8px}
.steps h3{display:flex;align-items:center;gap:8px;color:var(--text-strong);font-size:14px;margin:6px 0 4px}
.steps li{display:flex;align-items:center;gap:10px;padding:1px 0 1px 8px}
.steps li .t{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:42% minmax(0,1fr);gap:0;min-height:0;border-top:1px solid var(--line)}
.tbody:not([data-tab=terminal]) .split{grid-template-columns:minmax(0,1fr);border-top:0}
.split>.sub{min-height:0;min-width:0}
.sub{display:flex;flex-direction:column;overflow:hidden}
.sub+.sub{border-left:1px solid var(--line)}
.sub>header{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);flex:none;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:var(--text-strong)}
.sub>header .path{text-transform:none;letter-spacing:0;color:var(--text);font-size:13px}
.sub>.sbody{overflow:auto;flex:1 1 auto;min-height:0}
.tree{padding:4px 8px}
.tree .tr{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;padding:1px 0;text-align:left;color:var(--text);min-width:0;height:21px}
.tree .tr:hover{color:var(--text-strong);background:rgba(255,255,255,.03)}
.tree .caret{width:10px;color:var(--dim);font-size:10px;flex:none;text-align:center}
.tree .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .badge{margin-left:auto;padding-right:6px;font-size:11px;font-weight:600}
.tree .tr.dir .nm{color:var(--blue)}
.badge.M{color:var(--amber)}.badge.A{color:var(--green)}
.diffh{color:var(--blue);padding:3px 12px;opacity:.9;white-space:pre;border-bottom:1px solid var(--line)}
.dl{display:grid;grid-template-columns:34px 34px 14px 1fr;white-space:pre;font-size:12.5px;line-height:1.55}
.dl .n{color:var(--dim);text-align:right;padding-right:8px;user-select:none}
.dl .s{text-align:center;user-select:none}
.dl.add{background:var(--add-bg)}.dl.add .s{color:var(--green)}
.dl.del{background:var(--del-bg)}.dl.del .s{color:var(--red)}
.dfile{flex:none;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.dfile>header{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.16);position:sticky;top:0;z-index:1;border-radius:8px 8px 0 0}
.dfile.collapsed>header{border-bottom:0;border-radius:8px}
.dfile>header .path{color:var(--text-strong);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dfile>header .meta{margin-left:auto;flex:none;display:flex;gap:8px}
.dfile .collapse{display:grid;place-items:center;width:20px;height:20px;padding:0;border:0;background:transparent;color:var(--dim);cursor:pointer}
.dfile .collapse:hover{color:var(--text)}
.dfile .collapse svg{width:14px;height:14px;transition:transform .15s ease}
.dfile.collapsed .collapse svg{transform:rotate(-90deg)}
.tk-k{color:#c3a6ff}.tk-s{color:#9ad98f}.tk-c{color:#8b93a3;font-style:italic}.tk-n{color:var(--orange)}.tk-f{color:var(--blue)}
.testout{padding:6px 14px;white-space:pre;overflow:auto;flex:1 1 auto;min-height:0}
.testout .ok{color:var(--green)}
.mini-tabs{display:flex;border-bottom:1px solid var(--line);flex:none;height:28px;align-items:stretch}
.mini-tabs .tab{padding:0 14px;font-size:12px}
.inputbar{flex:none;margin:0 12px 12px;border:1px solid var(--border);border-radius:8px;background:rgba(21,23,27,.9);display:flex;flex-direction:column;box-shadow:0 0 0 1px rgba(255,255,255,.02),0 0 24px rgba(110,168,255,.06)}
.inputbar form{display:flex;align-items:center;gap:10px;padding:0 12px;height:44px}
.inputbar input[type=text]{flex:1;background:none;border:0;outline:0;color:var(--text-strong);height:100%;min-width:0}
.inputbar input::placeholder{color:var(--dim)}
.inputbar:focus-within{border-color:var(--accent)}
.agent-switch{flex:none;margin:-4px 14px 8px;padding:4px;border:0;border-radius:6px;background:transparent;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.agent-option{height:20px;padding:0;border:0;border-radius:3px;background:none;color:var(--text);display:inline-flex;align-items:center;gap:6px;text-align:left}
.agent-option:hover,.agent-option[aria-selected=true]{background:none;color:var(--text-strong)}.agent-mark{width:8px;color:var(--purple);font-weight:700;flex:none}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 12px;color:var(--text-strong)}
.btn:hover{background:var(--elevated)}
.btn.icon{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--border);border-radius:6px;background:none;color:var(--accent)}
.modebar{flex:none;margin:-6px 14px 10px;padding:0 12px;height:22px;display:flex;align-items:center;gap:6px;border:0;white-space:nowrap;overflow:hidden;font-size:11.5px}
.modebar .spacer{flex:1;min-width:6px}
.modebar .mode{display:flex;align-items:center;gap:5px;background:none;border:0;padding:0;color:var(--amber);min-width:0;font-size:inherit}
.modebar .mode .mv,.modebar .kvp{flex:none}
.modebar .mode .mh{overflow:hidden;text-overflow:ellipsis;min-width:0}
.modebar .mode .mi{display:inline-flex}
.modebar .mode .mh{color:var(--dim)}
.modebar .k{color:var(--dim)}
.modebar .mval{color:var(--teal)}
.modebar .eval{color:var(--purple)}
.modebar .sep{color:var(--dim)}

.tbody{grid-template-rows:auto auto minmax(0,1fr)!important}
.tbody[data-tab=agent],.tbody[data-tab=workspace],.tbody[data-tab=diff]{grid-template-rows:auto!important;align-content:start}
.split>.sub{border-left:0}
.rcol{display:flex;flex-direction:column;min-height:0;min-width:0;border-left:1px solid var(--line)}
.rcol>.sub{border-left:0}
.rcol>.sub.d{flex:1 1 0}
.rcol>.sub.t{flex:0 0 46%;min-height:160px;border-top:1px solid var(--line)}
.tbody:not([data-tab=terminal]) .split{height:100%}
.pad{padding:10px 14px}

/* topology v1 */
.topo1{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,auto);gap:22px 14px;padding:6px 4px}
.topo1 svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.topo1 svg.links path{fill:none;stroke:rgba(217,217,224,.48);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.topo1 .nd{position:absolute;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent-light);box-shadow:0 0 8px 2px rgba(217,217,224,.55)}
.topo1 .ncard:not(.core){background:transparent}
.ncard{--c:var(--border);position:relative;border:1px solid color-mix(in srgb,var(--c) 75%,transparent);border-radius:7px;background:color-mix(in srgb,var(--c) 7%,#111318);padding:8px 10px;min-width:0;z-index:1}
.ncard h3{display:flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:5px;white-space:nowrap}
.ncard h3 .ic{width:15px;height:15px}
.ncard ul li{font-size:12px;color:var(--text);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-blue{--c:var(--blue)}.t-red{--c:var(--red)}.t-green{--c:var(--green)}.t-amber{--c:var(--amber)}.t-teal{--c:var(--teal)}
.t-purple{--c:var(--purple)}.t-orange{--c:var(--orange)}.t-pink{--c:var(--pink)}.t-neutral{--c:#6b7385}
.t-neutral h3{color:var(--text-strong)}
.ncard.core{grid-column:2;grid-row:2;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;border:2px solid rgba(217,217,224,.45);background:radial-gradient(circle at 50% 30%,rgba(217,217,224,.10),transparent 70%),#101217;box-shadow:0 0 28px rgba(217,217,224,.08)}
.ncard.core img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(217,217,224,.3))}
.ncard.core .cn{color:var(--text-strong);letter-spacing:.2em;font-size:13px;margin-top:4px}
.ncard.core .cs{font-size:11.5px;color:var(--text)}
.bars .row{display:grid;grid-template-columns:118px minmax(0,1fr) 92px;gap:10px;align-items:center;padding:3px 0}
.bars .row span{white-space:nowrap}.bars .row .v{text-align:right;color:var(--text-strong)}
header:has(> #h-use1)>svg.ic{color:var(--c);stroke-width:2.5;filter:drop-shadow(0 0 3px currentColor)}
.select{margin-left:auto;display:flex;gap:10px;align-items:center;border:1px solid var(--border);border-radius:5px;padding:1px 8px;font-size:12px;color:var(--text-strong);background:var(--surface)}
.health li{display:grid;grid-template-columns:14px 1fr 130px 40px;align-items:center;gap:6px;padding:4px 0}
.health li .ms{text-align:right;color:var(--dim)}

/* view 2 */
.grid2{display:grid;grid-template-columns:260px minmax(0,1fr) 430px;gap:10px;padding:10px;min-height:0}
#view2 .col.l .panel{flex:0 1 auto}
#view2 .col.l .panel.grow{flex:1 1 auto}
.v2top .tchip{border-left:0}
.chead{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;white-space:nowrap}
.chead .sep{color:var(--dim)}
.latest-prompt{flex:1;min-width:0;overflow:hidden;color:var(--dim)}
.latest-prompt span{display:inline-block;padding-left:100%;white-space:nowrap;animation:prompt-scroll 16s linear infinite}
.cbar{width:54px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;flex:none}
.cbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#6b7385,var(--green))}
.chatstage{flex:1 1 0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.chatstage[hidden]{display:none}.chatstage.with-subagent{grid-template-columns:minmax(0,2fr) minmax(220px,1fr)}
.convo{min-width:0;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.subagent-view{min-width:0;min-height:0;margin:10px 12px 10px 0;border:1px solid var(--purple);border-radius:7px;display:flex;flex-direction:column;overflow:hidden;background:rgba(9,10,13,.72)}

const ic = (n, cls = '') => `<svg class="ic ${esc(cls)}" aria-hidden="true" focusable="false"><use href="#i-${esc(n)}"/></svg>`;
const pad = n => String(n).padStart(2, '0');
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const hms = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const displayHms = t => /^\d{2}:\d{2}$/.test(String(t)) ? `${t}:00` : String(t);
const fmtClock1 = d => `${DAYS[d.getDay()]} ${MONS[d.getMonth()]} ${pad(d.getDate())}\u00a0\u00a0${hms(d)}`;
const fmtUptime = s => {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}h ${pad(m)}m ${pad(x)}s` : `${m}m ${pad(x)}s`;
};
const SAFE = /^[a-z0-9-]+$/i; // for values used inside class names
const cls = v => (SAFE.test(String(v)) ? String(v) : '');

/* Controlled syntax highlighter: tokens are escaped, only our own spans are emitted. */
const KW = new Set(['import', 'from', 'export', 'async', 'await', 'function', 'const', 'let', 'var', 'return', 'if', 'else', 'new', 'type', 'interface', 'throw', 'try', 'catch', 'true', 'false', 'null']);
function hl(src) {
  const re = /(\/\/.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(\()?/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="tk-c">${t}</span>`;
    else if (m[2]) out += `<span class="tk-s">${t}</span>`;
    else if (m[3]) out += `<span class="tk-n">${t}</span>`;
    else if (KW.has(m[4])) out += `<span class="tk-k">${esc(m[4])}</span>${esc(m[5] || '')}`;
    else if (m[5]) out += `<span class="tk-f">${esc(m[4])}</span>(`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function deepMerge(t, p) {
  for (const k of Object.keys(p)) {
    if (k === '__proto__' || k === 'constructor' || k === 'prototype') continue;
    const v = p[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && t[k] && typeof t[k] === 'object' && !Array.isArray(t[k])) deepMerge(t[k], v);
    else t[k] = v;
  }
  return t;
}

function treeHTML(nodes, depth, path, base = '') {
  return nodes.map((n, i) => {
    const p = path.concat(i).join('.'), pl = 8 + depth * 16;
    const full = base ? base + '/' + n.name : n.name;
    if (n.children) {
      return `<button type="button" class="tr dir" style="padding-left:${pl}px" data-node="${p}" aria-expanded="${!!n.open}"><span class="caret" aria-hidden="true">${n.open ? '\u25be' : '\u25b8'}</span>${ic('folder')}<span class="nm">${esc(n.name)}</span></button>`
        + (n.open ? treeHTML(n.children, depth + 1, path.concat(i), full) : '');
    }
    const active = full === STATE.project.activeFile;
    return `<button type="button" class="tr file" style="padding-left:${pl + 16}px" data-node="${p}" data-file="${esc(full)}"${active ? ' aria-current="true"' : ''}>${ic('file')}<span class="nm">${esc(n.name)}</span>${n.badge ? `<span class="badge ${cls(n.badge)}" title="${n.badge === 'M' ? 'modified' : 'added'}">${esc(n.badge)}</span>` : ''}</button>`;
  }).join('');
}

function drawLinks() {
  const g = $('#topo1g'), svg = $('#links1');
  if (!g || !svg || !g.offsetWidth) return;
  const R = g.getBoundingClientRect(), pos = {};
  $$('.ncard', g).forEach(e => { const r = e.getBoundingClientRect(); pos[e.dataset.pos] = { l: r.left - R.left, r: r.right - R.left, t: r.top - R.top, b: r.bottom - R.top, cx: (r.left + r.right) / 2 - R.left, cy: (r.top + r.bottom) / 2 - R.top }; });
  const c = pos.core; if (!c) return;
  const paths = [], dots = [], at = (x, y) => dots.push([x, y]);
  const vertical = (sx, sy, ex, ey) => {
    if (Math.abs(sx - ex) < 1) return `M${sx} ${sy}V${ey}`;
    const my = (sy + ey) / 2, dx = Math.sign(ex - sx), dy = Math.sign(ey - sy), r = Math.min(10, Math.abs(ex - sx) / 2, Math.abs(ey - sy) / 4);
    return `M${sx} ${sy}V${my - dy * r}Q${sx} ${my} ${sx + dx * r} ${my}H${ex - dx * r}Q${ex} ${my} ${ex} ${my + dy * r}V${ey}`;
  };
  const horizontal = (sx, sy, ex, ey) => {
    if (Math.abs(sy - ey) < 1) return `M${sx} ${sy}H${ex}`;
    const mx = (sx + ex) / 2, dx = Math.sign(ex - sx), dy = Math.sign(ey - sy), r = Math.min(10, Math.abs(ex - sx) / 4, Math.abs(ey - sy) / 2);
    return `M${sx} ${sy}H${mx - dx * r}Q${mx} ${sy} ${mx} ${sy + dy * r}V${ey - dy * r}Q${mx} ${ey} ${mx + dx * r} ${ey}H${ex}`;
  };
  const link = (d, sx, sy, ex, ey) => { paths.push(d(sx, sy, ex, ey)); at(sx, sy); at(ex, ey); };
  const coreOffset = (c.r - c.l) * .24;
  const topLeft = c.cx - coreOffset, topRight = c.cx + coreOffset;
  const bottomLeft = c.cx - coreOffset, bottomRight = c.cx + coreOffset;
  if (pos.user) link(vertical, pos.user.cx, pos.user.b, topLeft, c.t);
  if (pos.hooks) link(vertical, pos.hooks.cx, pos.hooks.b, c.cx, c.t);
  if (pos.guards) link(vertical, pos.guards.cx, pos.guards.b, topRight, c.t);
  if (pos.sub) link(horizontal, pos.sub.r, pos.sub.cy, c.l, c.cy);
  if (pos.skills) link(horizontal, pos.skills.l, pos.skills.cy, c.r, c.cy);
  if (pos.mcp) link(vertical, pos.mcp.cx, pos.mcp.t, bottomLeft, c.b);
  if (pos.tools) link(vertical, pos.tools.cx, pos.tools.t, c.cx, c.b);
  if (pos.mem) link(vertical, pos.mem.cx, pos.mem.t, bottomRight, c.b);
  svg.setAttribute('width', g.offsetWidth); svg.setAttribute('height', g.offsetHeight);
  svg.innerHTML = paths.map(d => `<path d="${d}"/>`).join('') + dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" fill="rgba(217,217,224,.18)"/><circle cx="${x}" cy="${y}" r="2.5" fill="#F7F8FA"/>`).join('');
}

/* ---- messages & commands ---- */
function respond(text) {
  const t = text.trim();
  if (!t) return null;
  if (t.startsWith('/')) {
    const c = t.split(/\s+/)[0].toLowerCase();
    if (c === '/help') return 'Commands: ' + Object.keys(STATE.commands).join(' ');
    if (STATE.commands[c]) return `${c}: ${STATE.commands[c]} (stub, backend not connected)`;
    return `Unknown command ${c}. Try /help`;
  }
  return 'Received. (stub response, backend not connected)';
}

function pushMessage(msg) {
  const m = Object.assign({ role: 'user', time: hms(new Date()), text: '' }, msg || {});
  STATE.chat.messages.push(m);
  STATE.terminal.history.push({ k: m.role === 'user' ? 'cmd' : 'out', t: String(m.text) });
  renderChat(true); renderChead();
  renderHistory();
}

function submit(text) {
  const t = String(text || '').trim();
  if (!t) return;
  pushMessage({ role: 'user', text: t });
  const r = respond(t);
  if (r) pushMessage({ role: 'synthesis', text: r });
}

function update(patch) {
  if (patch && typeof patch === 'object') deepMerge(STATE, patch);
  renderAll();
  return STATE;
}

/* ---- events ---- */
function bind() {
  document.addEventListener('keydown', e => {
    const typing = e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
    if (e.key === 'Escape' && typing) { e.target.blur(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'l') { e.preventDefault(); $('#in1').focus(); return; }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#in1').value = ''; return; }
    if (typing || e.altKey || e.metaKey || e.ctrlKey) return;
  });

  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.agentView) { selectAgentView(t.dataset.agentView); }
    else if (t.dataset.ws && t.dataset.ws !== '__new') {
      STATE.workspaces.list.forEach(w => { w.selected = w.name === t.dataset.ws; });
      STATE.v1.workspace = t.dataset.ws; renderWorkspace(); renderRunning(); renderTop1();
    }
    else if (t.dataset.session) {
      const workspace = STATE.workspaces.list.find(w => w.name === t.dataset.sessionWorkspace);
      if (workspace) {
        STATE.workspaces.list.forEach(w => w.sessions.forEach(s => { s.selected = false; }));
        workspace.sessions.forEach(s => { s.selected = s.name === t.dataset.session; });
        STATE.v1.workspace = workspace.name; STATE.v1.session = t.dataset.session;
        renderWorkspace(); renderRunning(); renderTop1();
      }
    }
    else if (t.dataset.cmd) { const i = $('#in1'); i.value = t.dataset.cmd + ' '; i.focus(); }
    else if (t.dataset.btab) { STATE.bottomTab = t.dataset.btab; renderTabs2(); }
    else if (t.dataset.diff !== undefined) { const d = [STATE.diff].concat(STATE.extraDiffs || [])[Number(t.dataset.diff)]; if (d) { d.collapsed = !d.collapsed; renderPane(); } }
    else if (t.dataset.file) { STATE.project.activeFile = t.dataset.file; renderPane(); }
    else if (t.dataset.node) { const n = nodeAt(t.dataset.node); if (n && n.children) { n.open = !n.open; renderPane(); } }
    else if (t.dataset.tool) {
      const [mi, ti] = t.dataset.tool.split('.').map(Number), tl = STATE.chat.messages[mi].tools[ti];
      tl.open = tl.open === false; renderChat();
    }
  });

  document.addEventListener('keydown', e => {
    const option = e.target.closest && e.target.closest('[data-agent-view]');
    if (option && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const options = $$('[data-agent-view]', $('#agent-switch'));
      const i = options.indexOf(option), step = e.key === 'ArrowDown' ? 1 : -1;
      const next = options[Math.max(0, Math.min(options.length - 1, i + step))];
      selectAgentView(next.dataset.agentView);
      $(`[data-agent-view="${next.dataset.agentView}"]`, $('#agent-switch')).focus();
      return;
    }
    const tab = e.target.closest && e.target.closest('[role=tab]');
    if (!tab || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    const list = $$('[role=tab]', tab.parentElement).filter(x => x.getAttribute('role') === 'tab' && x.dataset.btab);
    const i = list.indexOf(tab); if (i < 0) return;
    const next = list[(i + (e.key === 'ArrowRight' ? 1 : list.length - 1)) % list.length];
    next.click();
    next.focus();
  });

  $('#form1').addEventListener('submit', e => { e.preventDefault(); const i = $('#in1'); submit(i.value); i.value = ''; });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'browser-form') return;
    e.preventDefault();
    const url = new FormData(e.target).get('url');
    if (url) { STATE.browser.url = String(url); renderPane(); }
  });
  window.addEventListener('resize', drawLinks);
}

function tick() {
  const now = new Date();
  const c1 = $('#clock1'); if (c1) c1.textContent = fmtClock1(now);
  const c2 = $('#clock2'); if (c2) c2.textContent = hms(now);
  STATE.session.uptimeSec += 1;
  const u = $('#uptime'); if (u) u.textContent = fmtUptime(STATE.session.uptimeSec);
}

/* ---- boot ---- */
$('#app').insertAdjacentHTML('beforeend', '');
