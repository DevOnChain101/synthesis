[package]
name = "synthesis-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synthesis desktop app: GPUI shell, onboarding, terminal grid (docs/specs/desktop.md)"
publish = false

[lints]
workspace = true

[lib]
name = "synthesis_desktop"
path = "src/lib.rs"

[[bin]]
name = "synthesis-desktop"
path = "src/main.rs"

[dependencies]
# Exact pins (ADR: docs/specs/desktop.md section 3). `gpui-pre` is the maintainers' snapshot of
# Zed's gpui, `gpui-component` pins the same one; never mix with a git `gpui`.
gpui-component = "=0.8.1"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
gpui-kit-assets = "=0.8.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
alacritty_terminal = "=0.26.0"
synthesis-app = { path = "../../crates/synthesis-app" }
synthesis-config = { path = "../../crates/synthesis-config" }
synthesis-core = { path = "../../crates/synthesis-core" }
synthesis-harness = { path = "../../crates/synthesis-harness" }
synthesis-permissions = { path = "../../crates/synthesis-permissions" }
synthesis-providers = { path = "../../crates/synthesis-providers" }
synthesis-settings = { path = "../../crates/synthesis-settings" }
synthesis-tools = { path = "../../crates/synthesis-tools" }
synthesis-tui = { path = "../../crates/synthesis-tui" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
url = "2"

# Command Line Tools only (no Xcode): compile Metal shaders at runtime instead of `xcrun metal`.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-apple = { version = "=0.3.10", features = ["runtime_shaders"] }

[dev-dependencies]
tempfile = "3.27.0"
