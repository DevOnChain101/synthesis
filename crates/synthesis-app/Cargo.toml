[package]
name = "synthesis-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Harness wiring behind `synt` and the interactive app (prepare, Common, Prepared)"

[lints]
workspace = true

[features]
# Enables `--provider fake:<script.json>` (scripted model, no network). Debug builds only.
test-provider = ["synthesis-sandbox/test-backend"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
url = "2.5.8"
base64 = "0.22"
cap-std = "4.0.3"
synthesis-browser = { path = "../synthesis-browser" }
synthesis-config = { path = "../synthesis-config" }
synthesis-context = { path = "../synthesis-context" }
synthesis-core = { path = "../synthesis-core" }
synthesis-events = { path = "../synthesis-events" }
synthesis-harness = { path = "../synthesis-harness" }
synthesis-hooks = { path = "../synthesis-hooks" }
synthesis-mcp = { path = "../synthesis-mcp" }
synthesis-peers = { path = "../synthesis-peers" }
synthesis-permissions = { path = "../synthesis-permissions" }
synthesis-providers = { path = "../synthesis-providers" }
synthesis-platform = { path = "../synthesis-platform" }
synthesis-sandbox = { path = "../synthesis-sandbox" }
synthesis-session = { path = "../synthesis-session" }
synthesis-view = { path = "../synthesis-view" }
synthesis-settings = { path = "../synthesis-settings" }
synthesis-terminal = { path = "../synthesis-terminal" }
synthesis-tools = { path = "../synthesis-tools" }
synthesis-cli-ui = { path = "../synthesis-cli-ui" }
synthesis-verification = { path = "../synthesis-verification" }
synthesis-workspace = { path = "../synthesis-workspace" }
rusqlite = { version = "0.41", features = ["bundled"] }
globset = "0.4"
synthesis-memory = { path = "../synthesis-memory" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonschema = { version = "0.60", default-features = false }
sha2 = "0.10"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "signal", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", default-features = false }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW constant only (no unsafe): files are never opened through a symlink; tcflush (safe
# wrapper) drops typed-ahead terminal input before a prompt
libc = "0.2"
rustix = { version = "1", features = ["termios", "stdio"] }

[dev-dependencies]
tempfile = "3.27.0"
